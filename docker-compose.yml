services:
  db:
    image: postgres:16-alpine
    container_name: veasna_shop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: veasna
      POSTGRES_PASSWORD: veasna_password
      POSTGRES_DB: veasna_shop
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veasna -d veasna_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: veasna_shop_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://veasna:veasna_password@db:5432/veasna_shop
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "5050:5000"

volumes:
  db_data: